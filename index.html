<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="accent-bar" aria-hidden="true"></div>

  <div class="container">
    <header class="hub-header">
      <div class="header-top">
        <h1>PROJECT HUB</h1>
        <span id="project-count" class="count-badge">0 Projects</span>
      </div>
      <p class="subtitle">직접 만든 웹 앱과 유틸리티 모음</p>

      <div class="controls">
        <nav id="category-tabs" class="tabs" aria-label="카테고리 필터"></nav>
        <div class="search-wrap">
          <input
            type="search"
            id="search-input"
            placeholder="이름, 설명, 태그 검색..."
            autocomplete="off"
          />
        </div>
      </div>
    </header>

    <main>
      <div id="project-grid" class="grid"></div>
      <p id="empty-state" class="empty-state" hidden>
        조건에 맞는 프로젝트가 없습니다.
      </p>
    </main>

    <footer class="hub-footer">
      <span>Hosted on GitHub Pages</span>
    </footer>
  </div>

  <script src="js/projects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
